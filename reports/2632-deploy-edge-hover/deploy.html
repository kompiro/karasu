<!doctype html><meta charset="utf-8"><style>
    body { margin: 0; background: #0d1117; }
    .preview-container { display: block; }
    /* Fit the canvas to the page so every edge is reachable by the pointer:
       the dify deploy view is several thousand px wide at natural size. */
    .preview-container svg { display: block; width: 100%; height: auto; }
    /* ── Edge hover affordance ─────────────────────────────────────────
   Edges with a canonical id are right-clickable. The renderer adds a
   wide transparent hit-line behind the visible stroke; the cursor and
   hover-tinted stroke advertise the interactive surface.

   The class tracks right-clickability only. The hit-line is emitted on a
   wider condition (#2543): an edge carrying a property block is
   left-clickable for its detail panel even when a base collision cleared
   its id, and such an edge gets the hit-line without this class, since no
   direction menu can open for it.

   Only the SVG-internal `g.krs-edge--interactive` is targeted so the
   styling is scoped to the rendered diagram. The hit-line itself
   stays transparent — only its stroke widens the click target. */
.preview-container svg .krs-edge--interactive {
  cursor: context-menu;
}

.preview-container svg .krs-edge:hover line:not(.krs-edge__hitline),
.preview-container svg .krs-edge:hover polyline:not(.krs-edge__hitline),
.preview-container svg .krs-edge:hover path:not(.krs-edge__hitline) {
  stroke-width: 3;
  filter: brightness(1.4);
}

.preview-container svg .krs-edge:hover text {
  filter: brightness(1.4);
}

/* Progressive disclosure (#1186): when an interactive edge is hovered, dim
   the other edges so the focused one stands out. Pure CSS — no React state,
   no DOM mutation — so it survives SVG re-renders and does not race with
   useSystemView debouncing (see #1171).

   Trigger is gated to `.krs-edge--interactive:hover` so hovering a
   non-interactive edge (one without a canonical id, e.g. system-internal
   edges with no domain meaning) does not dim its peers.

   `!important` is used on both the focused-edge lift and the peer-dim so
   the rules win against the diff-mode opacity rules below
   (`[data-diff-state="unchanged"] { opacity: 0.55 }` and
   `[data-diff-state="added"|"removed"|"changed"] { opacity: 1 !important }`).
   Without this, hovering an unchanged edge in diff mode would leave it at
   0.55 (focused edge fails to stand out), and added/removed/changed peers
   would resist dimming — the focus effect would only partially work. */
.preview-container svg .krs-edge {
  transition: opacity 0.15s ease;
}

.preview-container svg .krs-edge:hover {
  opacity: 1 !important;
}

.preview-container svg:has(.krs-edge:hover) .krs-edge:not(:hover) {
  opacity: 0.25 !important;
}

/* SPIKE #2632: a hovered edge inside the muted ghost group cannot lift itself.
   Group opacity composites, so `opacity: 1` on the child still renders at
   0.3 — the deploy view's every edge, and the cross-service ghost edges on a
   drilled-in service view. Lift the *group* while it hosts the hover, and the
   child rules above then apply on a full-strength ground. */
.preview-container svg .ghost-edges:has(.krs-edge:hover) {
  opacity: 1;
}
