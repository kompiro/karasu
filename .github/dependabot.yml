version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # 既定の 5 だと月曜バッチで枠が埋まり、peer で結ばれた依存の片方が
    # オファーされないまま残る。枠が空くのを待つ間に片方だけマージすると
    # peer 不整合を lockfile に固定してしまうため 8 に引き上げる（ADR-2447）。
    # ただし枠をいくら広げても pair の同時到着は保証されない。相互に
    # ブロックする組は枠ではなく下の groups: で結ぶ（ADR-2671）。
    open-pull-requests-limit: 8
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      # react と react-dom は版が一致していないと import 時に throw するため、
      # 別々の PR に割れるとどちらも単独ではマージできなくなる（ADR-2318）。
      # 型定義も同じ版系列に追随させるため同居させる。
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # client と server の protocol 版が食い違うと editor ↔ preview の
      # position がずれ、AT-0037-9 / AT-0038 / AT-0039 が落ちる。片側だけの
      # PR は単独では採れないので同居させる（#2337）。
      # protocol は client / server の両方が exact pin で持つため、
      # この group が効くのは 10.x 以降（ADR-2333 の時点では pin が
      # 先に効いて group だけでは解決しなかった）。
      # textdocument も同居させる — vscode-languageclient@10 はこれを
      # exact pin で持つので（9 には無かった依存）、単独で来ると版がずれる。
      # patterns は前方一致ではなく完全一致なので 1 行ずつ挙げる。
      lsp:
        patterns:
          - "vscode-languageserver"
          - "vscode-languageserver-protocol"
          - "vscode-languageserver-textdocument"
          - "vscode-languageclient"
      # @vitest/coverage-v8 は vitest を完全一致ピンの peer で持つ
      # （4.1.11 の peer は "vitest": "4.1.11"）。片方だけマージすると
      # upstream が支えない組み合わせが lockfile に固定されるが、pnpm は
      # strict-peer-dependencies なしで走るので install も CI も通ってしまう。
      # exact peer は react / lsp と同じクラスの制約なので同じ機構で結ぶ
      # （ADR-2447 / ADR-2671 で 2 度発生し、どちらも差し替え PR で人手で
      # 揃えた）。patterns は完全一致なので 1 行ずつ挙げる。
      vitest:
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
