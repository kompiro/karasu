version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # 既定の 5 だと月曜バッチで枠が埋まり、peer で結ばれた依存
    # （vitest と @vitest/coverage-v8 など）の片方がオファーされないまま
    # 残る。枠が空くのを待つ間に片方だけマージすると peer 不整合を
    # lockfile に固定してしまうため 8 に引き上げる（ADR-2431）。
    open-pull-requests-limit: 8
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      # react と react-dom は版が一致していないと import 時に throw するため、
      # 別々の PR に割れるとどちらも単独ではマージできなくなる（ADR-2318）。
      # 型定義も同じ版系列に追随させるため同居させる。
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
