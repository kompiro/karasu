name: E2E

# Triggered by path filter, not by an `e2e` label (ADR-1729). The label
# was an opt-in that created a detection blind spot: a PR changing a surface the
# E2E suite asserts on but missing the label could merge with stale selectors
# undetected (TPL-1725, #1725 / #1548). Mirrors the Preview workflow's
# label->path migration (ADR-579). nightly (e2e-nightly.yml) remains the
# final safety net.
#
# `Playwright` is a Required status check (ADR-1866). The paired stub
# `e2e-skip.yml` reports it on PRs that don't match the `paths` below, so they
# don't stay permanently pending. Keep `e2e-skip.yml`'s `paths-ignore` in exact
# sync with the `paths` list here (TPL-1480).
#
# Besides the app and the suite, the list covers each workspace package the
# app depends on (`packages/app/package.json`: core and i18n; i18n depends on
# core) and the repo files specs load from disk (`examples/`, e.g. at-1646
# opens every gallery example): a change to any of them alone must start the
# suite too. Root build config other than `package.json` (e.g. `tsconfig.json`)
# is left out; the Typecheck and Build steps of `ci.yml`'s Check job catch a
# break there.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "packages/app/**"
      - "packages/core/**"
      - "packages/e2e/**"
      - "packages/i18n/**"
      - "examples/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/e2e.yml"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright
    # Skipped on draft PRs: see the note in `ci.yml` (ADR-2643).
    if: github.event.pull_request.draft != true
    # Ubicloud runner (ADR-1890). Playwright installs its own browsers + deps
    # below, so the runner image only needs a standard Ubuntu base.
    runs-on: ubicloud-standard-4-ubuntu-2404
    # Setup plus the suite (ADR-3257). The deps install below is an unbounded
    # `apt-get` against whatever mirror the runner draws, so this budget has to
    # clear the worst install observed on this runner class (1013s) on top of
    # the test step's own bound. It is not the bound that means "the suite
    # hung" — that one is on `Run E2E tests` and fires first.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @karasu-tools/e2e exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @karasu-tools/e2e exec playwright install-deps chromium

      - name: Run E2E tests
        # The bound that means "the suite hung" (ADR-3257): it covers the tests
        # alone, so a slow OS package install delays this job instead of
        # cancelling a suite that is passing. This is a hang bound, not a
        # headroom estimate — passing runs have been measured at 8.1-14.0
        # minutes (2026-10-15..17, 270 tests), and a regression that fails
        # every spec is cut here rather than reported case by case.
        timeout-minutes: 25
        run: pnpm --filter @karasu-tools/e2e test

      # Informative-only — surfaces tests that failed once then passed on
      # retry so the flake count is visible per PR (TPL-976 / #1271).
      - name: Surface flaky retry-passes
        if: always()
        run: pnpm exec tsx scripts/ci/playwright-flaky-summary.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: packages/e2e/playwright-report
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-test-results
          path: packages/e2e/test-results
          retention-days: 14
