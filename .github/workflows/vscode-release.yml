name: VS Code Extension Release

# Publishes the `packages/vscode` extension to the VS Code Marketplace under
# publisher `karasu-tools` (extension id `karasu-tools.karasu-vscode`).
#
# Manual-only (`workflow_dispatch`) — the extension is released on its own
# cadence, separate from the changesets-driven npm release of the `karasu` CLI.
# Versioning IS managed by changesets (`karasu-vscode` was removed from
# `.changeset/config.json` `ignore`): `changeset version` bumps
# `packages/vscode/package.json` + writes its CHANGELOG. But `karasu-vscode` is
# `private: true`, so `changeset publish` (release.yml) never publishes it to
# npm — Marketplace publish stays here, run manually after the version is
# bumped. The version published is whatever is in `packages/vscode/package.json`,
# built from the commit that set that version (not the tip of main), and the
# `record` job then tags it `karasu-vscode@<version>` and adds it to that
# commit's GitHub Release `release-YYYY-MM-DD` (#2939).
# See docs/design/vscode-changeset-versioning.md (refines ADR-1315),
# Issue #1316, and docs/process.md "VS Code 拡張のリリース".
#
# Auth: Microsoft Entra ID via GitHub OIDC (no stored secret, nothing to expire
# — Azure DevOps long-lived PATs retire 2026-12-01). `azure/login` exchanges the
# GitHub OIDC token for an Entra token via a federated credential, then
# `vsce publish --azure-credential` (vsce >= 2.26.1) acquires the Marketplace
# token from that Azure CLI session. Prerequisites (human, see #1316): an Entra
# app registration with a federated credential trusting this repo, its
# service principal added as a member of the `karasu-tools` publisher, and the
# `AZURE_CLIENT_ID` / `AZURE_TENANT_ID` repo *variables* (public identifiers,
# not secrets) set. Like `release.yml` guards npm publish on `NPM_TOKEN`, the
# publish step here is guarded on `AZURE_CLIENT_ID`: until it is set the job
# still builds and packages the .vsix (validating bundling + `.vscodeignore`)
# but skips the actual publish.

on:
  workflow_dispatch:
    inputs:
      pre_release:
        description: "Publish to the VS Code pre-release channel"
        type: boolean
        default: false

concurrency:
  group: vscode-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for the GitHub OIDC token azure/login exchanges

jobs:
  release:
    name: Publish VS Code extension
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      published: ${{ steps.publish.outcome == 'success' && inputs.pre_release != true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Build from the commit that set the extension's current version — the
      # release commit whose CHANGELOG was reviewed — not from the tip of main,
      # which may already carry changes that belong to the next release. The
      # tag below is put on the same commit, so the tag names exactly the source
      # that was published (#2939).
      - name: Check out the release commit
        id: source
        run: |
          commit=$(git log -1 --format=%H -G'"version":' -- packages/vscode/package.json)
          if [ -z "$commit" ]; then
            echo "::error::No commit sets the version of packages/vscode/package.json."
            exit 1
          fi
          version=$(git show "${commit}:packages/vscode/package.json" | jq -r .version)
          git checkout --quiet "$commit"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "::notice::Building karasu-vscode ${version} from ${commit}."

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Build the workspace first so the extension's own build can resolve the
      # `@karasu-tools/*` dist outputs. `pnpm run build` builds core → i18n →
      # lsp (the order the extension's bundled LSP server needs); the vscode
      # extension is not part of it (see ci.yml), so it is packaged separately
      # below. Without this step the package step's lsp build fails to resolve
      # `@karasu-tools/core` / `@karasu-tools/i18n` on a clean checkout.
      - name: Build workspace
        run: pnpm run build

      # Build + package always, so the run validates esbuild bundling
      # (out/server.js present — assert-server-bundled) and `.vscodeignore`
      # even before the Entra identity is configured.
      - name: Package extension
        run: pnpm --filter karasu-vscode run package

      - name: Check publish prerequisites
        id: prereqs
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "can_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::AZURE_CLIENT_ID variable is not set — built and packaged the .vsix but skipping publish (expected pre-launch; see #1316)."
            echo "can_publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Exchange the GitHub OIDC token for an Entra token via the federated
      # credential. No subscription is involved — the Marketplace is an Azure
      # DevOps resource, not an Azure subscription resource — so log in with
      # allow-no-subscriptions.
      - name: Azure login (Entra ID via OIDC)
        if: steps.prereqs.outputs.can_publish == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # `vsce --azure-credential` picks up the Azure CLI session from the login
      # step (no PAT). The extension is already bundled into out/, so publish
      # with --no-dependencies; the package step above already built it.
      - name: Publish to Marketplace
        id: publish
        if: steps.prereqs.outputs.can_publish == 'true'
        working-directory: packages/vscode
        run: |
          if [ "${{ inputs.pre_release }}" = "true" ]; then
            pnpm exec vsce publish --azure-credential --no-dependencies --pre-release
          else
            pnpm exec vsce publish --azure-credential --no-dependencies
          fi

  # Tags the published version on its release commit and extends that commit's
  # GitHub Release (created by release.yml for the npm packages, or created
  # here when only the extension shipped). Runs only after a successful stable
  # Marketplace publish, so a version that failed to publish never gets a tag
  # (#2939). Pre-release builds are not tagged (#2940).
  record:
    name: Record release
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag and create or edit the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the script reads existing release-* tags

      # Node 24 runs the .mts script through type stripping; no install needed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Push the extension tag
        env:
          COMMIT: ${{ needs.release.outputs.commit }}
          TAG: karasu-vscode@${{ needs.release.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            if [ "$(git rev-list -n1 "refs/tags/${TAG}")" != "$COMMIT" ]; then
              echo "::error::${TAG} already exists on another commit."
              exit 1
            fi
            echo "${TAG} already points at ${COMMIT}."
          else
            git tag "$TAG" "$COMMIT"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ needs.release.outputs.commit }}
        run: node scripts/release/github-release.mts --commit "$COMMIT"
