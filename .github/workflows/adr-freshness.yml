name: ADR index freshness

# Watches the generated ADR index on main (Issue #3416, TPL-2786). PRs no longer
# carry `docs/adr/effective.md`, `graph.md` and `graph/`; a daily Claude routine
# regenerates them through `pnpm adr:regenerate-pr`. If the routine stops, or two
# runs in a row do not merge, nothing else notices: main's index just goes
# stale.
#
# This fails only when the oldest change main's index does not reflect is
# older than 50 hours (scripts/adr/check-freshness.ts). An ADR merged right
# after the routine's fetch, a run that waits out the checks and the next run
# that picks its PR up take up to about 48 hours; one missed day is already in
# the routine's own report. A scheduled run that fails notifies the workflow's
# owner.
#
# Read-only: it compares files and opens nothing. It runs a few hours after the
# routine (19:23 UTC), so the day's regeneration PR has had time to merge.
# `workflow_dispatch` is for checking by hand.

on:
  schedule:
    - cron: "41 23 * * *"
  workflow_dispatch:

concurrency:
  group: adr-freshness
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  freshness:
    name: ADR index freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          # The check walks main's first-parent history back 50 hours.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Check that main's ADR index is no more than 50 hours behind
        run: pnpm exec tsx scripts/adr/check-freshness.ts
