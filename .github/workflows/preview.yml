name: Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - "packages/app/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/preview.yml"

  # Spikes (PoC branches) are looked at and then thrown away, so they never get a PR
  # and would otherwise have no route to the preview environment. There is deliberately
  # no `paths:` filter here: pushing a spike branch is an explicit act, and a push that
  # silently deploys nothing is worse than an occasional redundant build.
  push:
    branches:
      - "spike/**"

  # Branch deletion is the only cleanup signal a spike preview has (no PR to close).
  # `delete` cannot be filtered by branch, so the cleanup job runs for every deleted
  # branch; it is idempotent and only touches `env=preview` deployments of that branch.
  delete:

concurrency:
  # pull_request events key on the head branch, so a close still cancels an in-flight
  # deploy for the same branch (previous behaviour); push/delete key on their own ref.
  group: preview-${{ github.event_name }}-${{ github.head_ref || github.event.ref || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy Preview to Cloudflare Pages
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.user.type != 'Bot')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build (core)
        run: pnpm --filter @karasu-tools/core run build

      - name: Build (app)
        run: pnpm --filter @karasu-tools/app run build

      - name: Deploy Preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler runs from the repo root and picks up the root `functions/`
          # dir (the /render Pages Function) alongside the deployed assets.
          # `head_ref` is PR-only; a spike push falls back to its own branch name.
          command: pages deploy packages/app/dist --project-name=karasu --branch=${{ github.head_ref || github.ref_name }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      # A PR gets the URL from its deployment status; a spike push has nowhere to put it,
      # so report the URL wrangler actually returned (branch aliases are slugged and
      # truncated by Cloudflare, so it cannot be reconstructed from the branch name).
      - name: Report preview URL
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "### Preview deployed"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Branch | \`${BRANCH}\` |"
            echo "| Branch alias | ${ALIAS_URL:-(none)} |"
            echo "| This deployment | ${DEPLOY_URL:-(none)} |"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Delete Preview Deployments
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'closed') ||
      (github.event_name == 'delete' && github.event.ref_type == 'branch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Delete preview deployments for branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # On `delete`, `github.event.ref` is the bare branch name (no `refs/heads/`),
          # which is exactly what was passed to `pages deploy --branch=`.
          BRANCH: ${{ github.head_ref || github.event.ref }}
        run: |
          if [ -z "$BRANCH" ]; then
            echo "No branch name resolved from the event; nothing to clean up."
            exit 0
          fi

          deployment_ids=$(curl -s \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/karasu/deployments?env=preview" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | \
            jq -r --arg branch "$BRANCH" '.result[] | select(.deployment_trigger.metadata.branch == $branch) | .id')

          if [ -z "$deployment_ids" ]; then
            echo "No preview deployments found for branch: $BRANCH"
            exit 0
          fi

          for id in $deployment_ids; do
            echo "Deleting deployment $id"
            curl -s -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/karasu/deployments/${id}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          done
