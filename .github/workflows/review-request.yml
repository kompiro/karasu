name: Review request

# CodeRabbit reviews only PRs labeled `risk: high` or `risk: design`
# (.coderabbit.yaml `auto_review.labels`, Issue #3286). Claude labels its PRs
# while they are drafts; this labels every other PR that arrives without a tier
# label `risk: high`, so an outside author's PR, or one opened from the GitHub UI,
# is treated as High: CodeRabbit and a human reading the diff. The `Review tier`
# check treats a missing label as High too; this makes the label say so. Whether
# CodeRabbit starts a review when the label arrives after the PR was opened is
# not verified (#3286); if it does not, the PR gets `@coderabbitai full review`
# by hand (docs/process/review.md "リスク段階").
#
# A comment would not do: CodeRabbit does not act on a command posted by
# github-actions[bot] (checked on #3286).
#
# The daily ADR index regeneration PR (`pnpm adr:regenerate-pr`, Issue #3416) is
# left alone: REST cannot open it as a draft, so it arrives open, and its script
# labels it `risk: low` and checks that label before merging. Labelling it High
# here would race that and start a CodeRabbit review of generated files. Only a
# head branch in this repository counts, so a fork's branch of the same name is
# still labelled.
#
# `pull_request_target` gives the token write access to label a PR from a fork.
# Nothing from the PR is checked out or run: the job reads the PR's labels
# through the API and adds one.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  label:
    name: Label untiered PRs High
    # A draft gets its tier label from its author before it leaves draft, and
    # `gh pr create --draft --label` adds the label in a call after the PR is
    # opened: labelling a draft on `opened` or `reopened` would race it or
    # pre-empt it. Drafts are labelled on `ready_for_review` instead, if they
    # still have no tier label then.
    #
    # A PR opened as non-draft has the same race: a Low ADR PR is opened with
    # `gh pr create --label "risk: low"` and no draft (`.claude/rules/adr.md`,
    # Issue #3504), so on `opened` and `reopened` the step waits for that second
    # call before it reads the labels.
    if: >-
      github.event.pull_request.draft == false &&
      !(github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'chore/adr-regenerate')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Add risk:high when no tier label is set
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
        run: |
          # A draft got its label while it was a draft; a PR that opens as
          # non-draft may still be getting its label from `gh pr create --label`.
          if [ "$ACTION" != "ready_for_review" ]; then
            sleep 30
          fi
          # Only the four tier labels count; a misspelled `risk: *` label is no tier.
          tiers=$(gh pr view "$PR" --repo "$REPO" --json labels \
            --jq '[.labels[].name | select(test("^risk: (low|design|medium|high)$"))] | length')
          if [ "$tiers" = "0" ]; then
            gh pr edit "$PR" --repo "$REPO" --add-label "risk: high"
          fi
