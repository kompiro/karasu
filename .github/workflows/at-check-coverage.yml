name: AT coverage check

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/acceptance/**"
      - "scripts/acceptance/**"
      - ".github/workflows/at-check-coverage.yml"
  push:
    branches: [main]
    paths:
      - "docs/acceptance/**"
      - "scripts/acceptance/**"
      - ".github/workflows/at-check-coverage.yml"

concurrency:
  group: at-check-coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run AT coverage tests
        run: pnpm run at:test

      - name: Check AT automation marker convention
        run: pnpm at:check-coverage --strict

      # Embedded `.krs` snippets are parsed repo-wide (acceptance / spec /
      # guide / concepts). Runs here as well as in `reference-docs-check.yml`
      # so an AT-only PR — which that workflow's `paths:` skips — still has
      # its snippets checked. Issue #2415.
      - name: Check embedded krs fences
        run: pnpm run lint:krs-fences
