name: Release — Prepare

# Prepare stage of the release pipeline, run as the monthly release train
# (#2922): a schedule fires every Sunday and the train departs on the last
# Sunday of the month; `workflow_dispatch` departs at once for an ad-hoc
# release. It runs `changeset version` (consumes pending changesets → bumps
# versions, writes CHANGELOG, updates the lockfile), pushes a
# `chore/release-YYYY-MM-DD` branch and opens a tracking Issue (label
# `release`) with the link that opens the release PR. Review the versions +
# CHANGELOG in that PR and squash-merge it: the merge touches
# packages/**/CHANGELOG.md and triggers Release (release.yml), which publishes
# npm and the VS Code extension, records the Release and closes the Issue.
#
# We push a branch rather than open the PR because GitHub Actions PR creation
# is disabled (Issue #1370); the Issue carries the "Compare & pull request"
# link. Opening the PR as a human is also what makes the required checks run
# (a GITHUB_TOKEN push does not trigger other workflows). See ADR-1370 and
# docs/release.md "リリースの流れ".
#
# The branch is named by date, not by a package version: versions are
# independent per package, so the CLI version does not move in every release.

on:
  schedule:
    # 00:00 UTC every Sunday (09:00 JST); the `depart` step lets only the last
    # Sunday of the month through. GitHub cron ORs day-of-month with
    # day-of-week, so "the last Sunday" cannot be written as a cron.
    - cron: "0 0 * * 0"
  workflow_dispatch:

concurrency:
  group: release-prepare
  cancel-in-progress: false

permissions:
  contents: write # push the chore/release-* branch
  issues: write # open the tracking Issue, comment on a leftover one
  pull-requests: read # find a leftover release PR

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      # An `exit 0` here would end only this step, so the decision is an output
      # that every later step is conditioned on.
      - name: Decide whether the train departs
        id: train
        env:
          EVENT: ${{ github.event_name }}
        run: |
          depart=$(node scripts/release/train.mts depart --event "$EVENT")
          echo "depart=${depart}" >> "$GITHUB_OUTPUT"
          if [ "$depart" != "true" ]; then
            echo "::notice::Not the last Sunday of the month: the train does not depart."
          fi

      # A train still open (its tracking Issue, or its release PR if the Issue
      # was closed by hand) blocks the next one instead of being overwritten:
      # a second release PR would carry the same unmerged changesets (TPL-2786).
      - name: Stop while the previous train is open
        if: steps.train.outputs.depart == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list --label release --state open --json number --jq '.[0].number // empty')
          pr=$(gh pr list --state open --json number,headRefName --jq '[.[] | select(.headRefName | startswith("chore/release-"))][0].number // empty')
          target=${issue:-$pr}
          if [ -n "$target" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${target}/comments" \
              -f body="This month's release train did not depart (${RUN_URL}): merge or close this train first." >/dev/null
            echo "::error::The previous release train (#${target}) is still open."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
        if: steps.train.outputs.depart == 'true'

      # `pnpm version-packages` = `changeset version && pnpm install
      # --lockfile-only`. Since @changesets/cli 3, `changeset version` exits 1
      # when no changeset is pending, so "nothing to release" is decided from
      # the changeset files before it runs rather than by swallowing that exit
      # code (TPL-2786: a real failure of `changeset version`, such as a mixed
      # changeset, must still fail this job). A changeset that names only
      # `ignore`d packages is not filtered out here; it also fails `changeset
      # version`, which is the right outcome because it can never be released.
      # Changesets prerelease mode (`changeset pre enter` / `.changeset/pre.json`)
      # is not part of this repo's release flow; if it ever is, `pre.json` with
      # `"mode": "exit"` must also get past this guard, because `changeset
      # version` applies the exit plan with no changeset files present.
      - name: Version and push release branch
        id: version
        if: steps.train.outputs.depart == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md -print -quit)" ]; then
            echo "::notice::No pending changesets: nothing to release."
            exit 0
          fi
          node scripts/release/train.mts versions > "$RUNNER_TEMP/before.json"
          pnpm version-packages
          if git diff --quiet && git diff --cached --quiet; then
            echo "::notice::No pending changesets: nothing to release."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="chore/release-${DATE}"
          SUBJECT=$(node scripts/release/train.mts commit-subject --before "$RUNNER_TEMP/before.json")
          node scripts/release/train.mts issue-body --before "$RUNNER_TEMP/before.json" --branch "$BRANCH" > "$RUNNER_TEMP/issue.md"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "$SUBJECT"
          git push -u origin "$BRANCH"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "::notice::Pushed ${BRANCH}."

      - name: Open the tracking Issue
        if: steps.version.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ steps.version.outputs.date }}
        run: |
          url=$(gh issue create --title "Release train ${DATE}" --label release --body-file "$RUNNER_TEMP/issue.md")
          echo "::notice::Tracking Issue: ${url}"
