name: Release — Prepare

# Prepare stage of the release pipeline. Manually triggered from the Actions
# tab. Runs `changeset version` (consumes pending changesets → bumps
# versions, writes CHANGELOG, updates the lockfile) and pushes a
# `chore/release-<version>` branch. Open a PR from that branch, review the
# version bumps + CHANGELOG, and squash-merge it — the merge touches
# packages/**/CHANGELOG.md and triggers Release (release.yml) to publish via
# OIDC.
#
# We push a branch rather than open the PR because GitHub Actions PR creation
# is disabled (Issue #1370); click "Compare & pull request" on the pushed
# branch. Opening the PR as a human is also what makes the required checks
# run (a GITHUB_TOKEN push does not trigger other workflows). See
# ADR-1370 and docs/process.md "リリースの流れ".

on:
  workflow_dispatch:

concurrency:
  group: release-prepare
  cancel-in-progress: false

permissions:
  contents: write # push the chore/release-* branch

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # `pnpm version-packages` = `changeset version && pnpm install
      # --lockfile-only`. Since @changesets/cli 3, `changeset version` exits 1
      # when no changeset is pending, so "nothing to release" is decided from
      # the changeset files before it runs rather than by swallowing that exit
      # code (TPL-2786: a real failure of `changeset version`, such as a mixed
      # changeset, must still fail this job). A changeset that names only
      # `ignore`d packages is not filtered out here; it also fails `changeset
      # version`, which is the right outcome because it can never be released.
      # Changesets prerelease mode (`changeset pre enter` / `.changeset/pre.json`)
      # is not part of this repo's release flow; if it ever is, `pre.json` with
      # `"mode": "exit"` must also get past this guard, because `changeset
      # version` applies the exit plan with no changeset files present.
      - name: Version and push release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md -print -quit)" ]; then
            echo "::notice::No pending changesets: nothing to release."
            exit 0
          fi
          pnpm version-packages
          if git diff --quiet && git diff --cached --quiet; then
            echo "::notice::No pending changesets — nothing to release."
            exit 0
          fi
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          BRANCH="chore/release-$VERSION"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "chore: release karasu $VERSION"
          git push -u origin "$BRANCH"
          echo "::notice::Pushed $BRANCH — open a PR and squash-merge it to publish."
