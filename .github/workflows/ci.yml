name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    # Docs-only changes don't affect lint / typecheck / build / test, so this
    # workflow is filtered out on those PRs. The companion `ci-skip.yml`
    # provides a stub `Check` job for docs-only PRs so the Required status
    # is still satisfied. Keep both filters in sync (Issue #953).
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    # Skipped on draft PRs (ADR-2643). A stack keeps every layer above the
    # bottom one in draft, and nobody reads a layer until it reaches the
    # bottom, so verifying it on every `gh stack sync` force-push buys
    # nothing. `ready_for_review` is in `types:` above so the real run
    # happens the moment the PR is opened for review: a job skipped by this
    # `if` reports **success** to the Required check, so the skip and the
    # trigger must always move together
    # (`scripts/ci/workflow-draft-gate.test.ts`).
    if: github.event.pull_request.draft != true
    # Ubicloud runner (ADR-1890): compute-bound verification jobs run on
    # Ubicloud, secret-bearing publish / deploy jobs stay GitHub-hosted.
    # `-ubuntu-2404` matches the image `ubuntu-latest` resolves to.
    # The runner-per-job policy is fenced by
    # `scripts/ci/workflow-runner-policy.test.ts`.
    runs-on: ubicloud-standard-4-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Knip
        run: pnpm run knip

      - name: Check circular dependencies
        run: pnpm run check:cycles

      - name: License allowlist
        run: pnpm run check:licenses

      # `adr check-assumptions` validates ADR `assumptions:` entries against
      # the real working tree — a code↔ADR consistency check. The companion
      # `adr-validate.yml` runs it too, but is path-filtered to `docs/adr/**`,
      # so it never runs on the code PRs most likely to break an assumption
      # (a code change can invalidate an existing assumption without touching
      # any ADR — see PR #1477). Running it here, in the already-Required
      # `Check` job that fires on code changes, closes that gap. Issue #1480.
      - name: Check ADR assumptions against the working tree
        run: pnpm exec adr check-assumptions --quiet

      # The reference-docs drift guard lives in its own workflow
      # (`reference-docs-check.yml`), mirroring the ADR setup, so it also runs
      # on docs-only PRs that `ci.yml`'s `paths-ignore` filters out. Issue #1342.

      # Every package, not an enumeration. This step used to name core / app /
      # cli one by one, which left `lsp`, `vscode`, `nest`, `i18n`, `docs-site`,
      # `vscode-e2e` and `scripts/` unchecked on the machine that gates merges
      # — the local `pnpm run typecheck` pre-push hook covered them all, so the
      # gap only bit where the hook never runs: bot-authored PRs. Dependabot's
      # #2432 was green on every check while breaking 12 assertions in
      # `packages/lsp` (Issue #2446 / TPL-2446). Run the root script, whose
      # `pnpm -r` reaches every package by construction; the companion guard
      # `scripts/ci/typecheck-coverage-policy.test.ts` fails if this reverts to
      # naming packages, or if a package stops defining `typecheck`.
      #
      # `pnpm -r run typecheck` needs no prior `Build (core)`: consumers set
      # `customConditions: ["development"]`, so a workspace dependency resolves
      # to its `src/` entry rather than the `dist/` that step produces.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Build (core)
        run: pnpm --filter @karasu-tools/core run build

      # `adr check-permalinks` validates each ADR `permalink:` (required
      # `source` .krs exists + deep `#krs-<view>-<id>` anchor resolves) — an
      # ADR↔.krs consistency check. It runs here in the already-Required
      # `Check` job (no path filter) so it fires on the .krs-side changes (a
      # rename) that a `docs/adr/**` filter would skip (TPL-1480). The
      # `krs` resolver imports the built `@karasu-tools/core`, so this step
      # must come *after* `Build (core)`. Issue #1830 / @kompiro/adr-tools#17.
      - name: Check ADR permalinks against the working tree
        run: pnpm run adr:check-permalinks

      - name: Test
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      # The vscode extension isn't part of `pnpm run build`. Build it here so
      # its `postbuild` assertion (out/server.js bundled) runs on every PR,
      # not only behind the `vscode-e2e` label. See Issue #1272 / TPL-1024.
      - name: Build (vscode)
        run: pnpm --filter karasu-vscode run build
