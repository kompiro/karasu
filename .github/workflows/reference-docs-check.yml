name: Reference docs check

# Companion of `reference-docs-check-skip.yml`. This workflow runs the real
# reference-docs drift guard (`gen-docs.ts --check`) plus the en/ja spec
# structure guard (`spec-structure-sync.ts`, Issue #1501) plus the guide
# diagram drift guard (`gen-guide-diagrams.ts --check`, Issue #1574) plus the
# roadmap ledger guard (`roadmap-issue-state.ts`, Issue #2245) on PRs
# that touch the reference single-source / guide / roadmap paths. The skip workflow emits a no-op
# `Reference docs` job for all other PRs so a Required status named
# `Reference docs` stays green repository-wide.
#
# Why a dedicated workflow: `ci.yml` has `paths-ignore: docs/**, **/*.md`, so
# a PR that only edits `docs/spec/*.md` (e.g. a hand edit inside a
# `<!-- gen:reference:* -->` region) gets the `ci-skip.yml` stub Check and
# the drift guard never runs in CI for that PR. lefthook catches it locally,
# but a contributor who bypasses lefthook would slip through. Issue #1342.
#
# Keep the `paths:` list below in sync with `reference-docs-check-skip.yml`'s
# `paths-ignore:` and with lefthook's `reference-docs-check` /
# `roadmap-issue-state` globs.

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/spec/**"
      - "docs/concepts.md"
      - "docs/concepts.ja.md"
      - "docs/guide/**"
      - "packages/core/src/builtins/reference-data.ts"
      - "scripts/reference/**"
      - "scripts/guide/**"
      - "scripts/lint/spec-structure-sync.ts"
      - "docs/roadmap.md"
      - "scripts/lint/roadmap-issue-state.ts"
      - ".github/workflows/reference-docs-check.yml"
  push:
    branches: [main]
    paths:
      - "docs/spec/**"
      - "docs/concepts.md"
      - "docs/concepts.ja.md"
      - "docs/guide/**"
      - "packages/core/src/builtins/reference-data.ts"
      - "scripts/reference/**"
      - "scripts/guide/**"
      - "scripts/lint/spec-structure-sync.ts"
      - "docs/roadmap.md"
      - "scripts/lint/roadmap-issue-state.ts"
      - ".github/workflows/reference-docs-check.yml"

concurrency:
  group: reference-docs-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # roadmap-issue-state reads issue state through the GraphQL API.
  issues: read

jobs:
  reference-docs-check:
    name: Reference docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Reference docs in sync
        run: pnpm exec tsx scripts/reference/gen-docs.ts --check

      - name: en/ja spec heading structure in sync
        run: pnpm run lint:spec-structure-sync

      - name: Guide diagrams in sync
        run: pnpm exec tsx scripts/guide/gen-guide-diagrams.ts --check

      # The roadmap's watch ledgers track work that has no Issue yet, and
      # nothing re-reads a row once its promotion trigger fires (Issue #2245).
      # This is the only guard here that needs the network — it reads issue
      # state — so it self-skips when the API is unreachable rather than
      # reddening a required check on a blip.
      - name: Roadmap does not contradict issue state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run lint:roadmap-issue-state
