name: Deploy karasu-nest

# A deploy of its own, on purpose. ADR-2578 decision 5 (carried forward from
# ADR-1990) separates this service from the Pages app so state and the session
# stay out of the static deploy; sharing a workflow with `deploy.yml` would put
# them back in the same blast radius and make the two impossible to roll back
# independently.
#
# `workflow_dispatch` only, for now. The service no longer reads anyone's
# repository (#2590), so the data-processor obligations that used to hold this
# shut are gone -- but a public submission surface still needs a ToS and a
# privacy policy before it is opened past its operator (#2691). Until then
# `NEST_SIGN_IN_ALLOWLIST` keeps sign-in to the operator (#2969). Automatic
# deploys on `main` are the last wire to connect, not the first.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate without deploying"
        type: boolean
        default: false

concurrency:
  group: nest-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    # GitHub-hosted rather than Ubicloud: secret-bearing deploy jobs stay on
    # GitHub runners per ADR-1890, and the policy is fenced by
    # scripts/ci/workflow-runner-policy.test.ts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (nest)
        run: pnpm --filter @karasu-tools/nest run typecheck

      - name: Test (nest)
        run: pnpm --filter @karasu-tools/nest run test

      # wrangler bundles `@karasu-tools/core` through its package.json
      # `exports`, which point at `dist/`. Typecheck and the tests resolve the
      # `development` condition to `src/` and pass without it, so only the
      # bundle notices a missing build.
      - name: Build (core)
        run: pnpm --filter @karasu-tools/core run build

      # A dry run still bundles (`--dry-run`) rather than skipping the step.
      # Skipping it is how a deploy that could not bundle passed as a green dry
      # run until the first real deploy.
      - name: Deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          # A token of its own, not the Pages token every other deploy uses
          # (#2969). This service holds sessions and submitters' data, which is
          # why ADR-2578 gave it a separate deploy; one credential for both
          # would put them back in the same blast radius. Fenced by
          # scripts/ci/nest-deploy-token.test.ts.
          apiToken: ${{ secrets.CLOUDFLARE_NEST_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/nest
          # Must be stated, not inferred. The action picks a package manager by
          # looking for a lockfile *in the working directory*; there is none in
          # `packages/nest`, so it falls back to npm, and npm cannot install into
          # a package.json carrying `workspace:*` (`EUNSUPPORTEDPROTOCOL`). The
          # same fix as `docs-preview.yml`.
          packageManager: pnpm
          command: deploy${{ inputs.dry_run && ' --dry-run' || '' }}
