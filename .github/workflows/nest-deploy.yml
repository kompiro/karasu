name: Deploy karasu-nest

# A deploy of its own, on purpose. ADR-2578 decision 5 (carried forward from
# ADR-1990) separates this service from the Pages app so state and the session
# stay out of the static deploy; sharing a workflow with `deploy.yml` would put
# them back in the same blast radius and make the two impossible to roll back
# independently.
#
# `workflow_dispatch` only, for now. The service no longer reads anyone's
# repository (#2590), so the data-processor obligations that used to hold this
# shut are gone -- but a public submission surface still needs a ToS and a
# privacy policy before it is opened past its operator (#2591). Automatic
# deploys on `main` are the last wire to connect, not the first.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate without deploying"
        type: boolean
        default: false

concurrency:
  group: nest-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    # GitHub-hosted rather than Ubicloud: secret-bearing deploy jobs stay on
    # GitHub runners per ADR-1890, and the policy is fenced by
    # scripts/ci/workflow-runner-policy.test.ts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (nest)
        run: pnpm --filter @karasu-tools/nest run typecheck

      - name: Test (nest)
        run: pnpm --filter @karasu-tools/nest run test

      - name: Deploy
        if: ${{ !inputs.dry_run }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/nest
          command: deploy
