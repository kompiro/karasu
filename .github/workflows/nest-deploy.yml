name: Deploy karasu-nest

# A deploy of its own, on purpose. ADR-2578 decision 5 (carried forward from
# ADR-1990) separates this service from the Pages app so state and the session
# stay out of the static deploy; sharing a workflow with `deploy.yml` would put
# them back in the same blast radius and make the two impossible to roll back
# independently.
#
# Deploys on every push to `main` that changes what ends up in the Worker
# bundle (ADR-3000). Who can reach the gallery is not decided here: a public
# submission surface still needs a ToS and a privacy policy before it is opened
# past its operator (#2691), and until then `NEST_SIGN_IN_ALLOWLIST` keeps
# sign-in to the operator in code (ADR-2969). Deploying `main` does not widen
# that list.
#
# `paths:` is nest itself plus every workspace package it depends on,
# transitively -- they are bundled into the Worker or, for `@karasu-tools/app`
# (and through it `@karasu-tools/i18n`), built into the gallery viewer it
# deploys as static assets (#2998), so a change there changes the deploy. scripts/ci/nest-deploy-trigger.test.ts walks the `workspace:`
# dependencies of packages/nest and fails when one is missing here, so adding a
# dependency cannot silently stop deploys.
# `pnpm-workspace.yaml` is listed because security fixes for bundled
# third-party code (e.g. `yaml`, `smol-toml` via core) land there as
# `overrides:` without touching any package.json. `pnpm-lock.yaml` is left out
# on purpose: it moves on nearly every Dependabot merge, and a bump of a direct
# dependency already touches a package.json listed below.
#
# `workflow_dispatch` stays for manual and `dry_run` deploys.

on:
  push:
    branches: [main]
    paths:
      - "packages/nest/**"
      - "packages/core/**"
      - "packages/app/**"
      - "packages/i18n/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/nest-deploy.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate without deploying"
        type: boolean
        default: false

concurrency:
  group: nest-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    # GitHub-hosted rather than Ubicloud: secret-bearing deploy jobs stay on
    # GitHub runners per ADR-1890, and the policy is fenced by
    # scripts/ci/workflow-runner-policy.test.ts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (nest)
        run: pnpm --filter @karasu-tools/nest run typecheck

      - name: Test (nest)
        run: pnpm --filter @karasu-tools/nest run test

      # wrangler bundles `@karasu-tools/core` through its package.json
      # `exports`, which point at `dist/`. Typecheck and the tests resolve the
      # `development` condition to `src/` and pass without it, so only the
      # bundle notices a missing build.
      - name: Build (core)
        run: pnpm --filter @karasu-tools/core run build

      # The gallery page is packages/app's standalone viewer (#2998), staged
      # into packages/nest/viewer-assets/ for wrangler.toml's `[assets]`.
      # Without it wrangler stops on the missing directory, dry run included.
      - name: Build (gallery viewer)
        run: pnpm --filter @karasu-tools/nest run build:viewer

      # A dry run still bundles (`--dry-run`) rather than skipping the step.
      # Skipping it is how a deploy that could not bundle passed as a green dry
      # run until the first real deploy. A push has no `inputs`, so it takes
      # the real `deploy` branch.
      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          # A token of its own, not the Pages token every other deploy uses
          # (#2969). This service holds sessions and submitters' data, which is
          # why ADR-2578 gave it a separate deploy; one credential for both
          # would put them back in the same blast radius. Fenced by
          # scripts/ci/nest-deploy-token.test.ts.
          apiToken: ${{ secrets.CLOUDFLARE_NEST_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/nest
          # Must be stated, not inferred. The action picks a package manager by
          # looking for a lockfile *in the working directory*; there is none in
          # `packages/nest`, so it falls back to npm, and npm cannot install into
          # a package.json carrying `workspace:*` (`EUNSUPPORTEDPROTOCOL`). The
          # same fix as `docs-preview.yml`.
          packageManager: pnpm
          command: deploy${{ inputs.dry_run && ' --dry-run' || '' }}
