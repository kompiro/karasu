name: Release

# SPIKE (#3685, stage B): not for merging.
#
# Checks that npm refuses an OIDC token from a job of `release.yml` that does
# not name the GitHub environment `npm`. The Trusted Publishers match the
# workflow file name, so this file replaces `release.yml` on this branch only.
# The job asks for `id-token: write` but has no `environment:`, and tries
# `npm stage publish` of a prerelease that is not on npm (`-envcheck.0`,
# `--tag envcheck`). The check passes only if the verbose log shows the OIDC
# exchange refused. If something gets staged, reject it on npmjs.com.
#
# Run: gh workflow run release.yml --ref spike/3685-stage-without-environment -f package=<name>

on:
  workflow_dispatch:
    inputs:
      package:
        description: A package that kept its Trusted Publisher connection at stage B
        required: true
        type: choice
        options:
          - karasu-skills
          - "@karasu-tools/core"
          - karasu

permissions:
  contents: read

jobs:
  envcheck:
    name: Stage without the environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - run: npm --version

      - name: Pack a prerelease that is not on npm
        id: pack
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          case "$PACKAGE" in
            karasu-skills) dir=packages/skills ;;
            "@karasu-tools/core") dir=packages/core ;;
            karasu) dir=packages/cli ;;
            *) echo "unknown package: $PACKAGE"; exit 1 ;;
          esac
          cd "$dir"
          version="$(node -p 'require("./package.json").version')-envcheck.0"
          if npm view "$PACKAGE@$version" version 2>/dev/null | grep -q .; then
            echo "$PACKAGE@$version is already on npm"; exit 1
          fi
          npm pkg set version="$version"
          tarball="$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" | tail -n 1)"
          echo "tarball=$RUNNER_TEMP/$tarball" >> "$GITHUB_OUTPUT"
          echo "Packed $PACKAGE@$version as $tarball"

      - name: Try npm stage publish without the environment
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm stage publish "$TARBALL" --tag envcheck --loglevel verbose
