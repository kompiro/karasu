name: Release

# Publish stage of the release pipeline (OIDC trusted publishing).
#
# Fires when a release PR lands: `changeset version` only ever rewrites
# package CHANGELOG.md files, so the `paths` filter makes this run on the
# release merge — not on every push to `main` (which would waste a full
# build to no-op). `workflow_dispatch` is kept as a manual re-run fallback.
# Prepare a release with the "Release — Prepare" workflow
# (release-prepare.yml), which runs `changeset version` and pushes a
# `chore/release-*` branch for review. See ADR-1370.
#
# `changeset publish` publishes any public package whose `package.json`
# version is not yet on npm, so this is a no-op between releases. The `record`
# job then pushes the tags of what was published and creates the release's
# GitHub Release `release-YYYY-MM-DD` (#2939).
#
# Authentication is **npm Trusted Publishing via GitHub OIDC** — no
# `NPM_TOKEN`. npm exchanges the workflow's OIDC token (`id-token: write`)
# for a short-lived publish credential, provided a Trusted Publisher is
# configured for each package on npmjs.com (org `kompiro`, repo `karasu`,
# workflow file `release.yml`). Requires npm >= 11.5.1 and Node >= 22.14.0,
# which the pinned Node 24 satisfies on its own (see the publish step).
# Provenance is generated automatically
# under trusted publishing — no `--provenance` flag / `NPM_CONFIG_PROVENANCE`
# needed. See ADR-9020 (OIDC migration; follows up the token-based
# auth of ADR-1315) and docs/process.md "リリース運用".
#
# Public packages: `karasu` (CLI), `@karasu-tools/core` and `karasu-skills` (the
# Claude Code plugin with the agent skills, #2932). `@karasu-tools/*`
# others, `@karasu-tools/i18n` (private), and `karasu-vscode` are not
# published here (the VS Code extension ships via its own workflow — #1316).

on:
  push:
    branches: [main]
    paths:
      - "packages/**/CHANGELOG.md" # release PRs (changeset version) touch these
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.published.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24" # resolves to the latest 24.x, which bundles npm >= 11.5.1 (OIDC)
          cache: "pnpm"

      # This job deliberately carries no step that globally upgrades the npm CLI
      # before publishing (it used to). The publish chain is
      # `changeset publish` → `pnpm publish` (changesets picks the package
      # manager it detects) → the `npm` CLI on PATH, because pnpm 10 still
      # delegates publish to npm. Trusted Publishing needs npm >= 11.5.1, and
      # Node 22 bundles npm 10.x — hence the old step. Node 24 bundles npm
      # 11.17+, so the runtime satisfies the floor by itself, and pulling an
      # unpinned npm from the registry at publish time would only re-add a
      # supply-chain surface to the one job that holds publish rights.
      #
      # pnpm 11 makes `pnpm publish` native (no npm delegation), at which point
      # pnpm's own version governs this floor instead — see Issue #2401.
      # Issue #2397 / ADR-2397.

      # All dependencies (incl. `@kompiro/*`) install from the public npm
      # registry — no token needed. Publishing uses OIDC (see header).
      - run: pnpm install --frozen-lockfile

      # `changeset publish` tags what it published with annotated tags
      # (`git tag <name>@<version> -m ...`), which need a committer identity.
      # The runner has none, and changesets ignores a failing `git tag`, so
      # without this every tag silently failed and `record` never ran (#2982).
      # The tags stay local to this job; `record` pushes them.
      - name: Set a git identity for the release tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # `pnpm run release` runs `pnpm build && changeset publish`. With a
      # Trusted Publisher configured and `id-token: write` set, npm publishes
      # tokenless via OIDC and attaches provenance automatically. Publishes
      # only versions not already on npm, so this is a no-op between releases.
      # The output is kept so the next step can check that every package it
      # reports as published got its tag.
      - name: Publish to npm
        run: |
          set -o pipefail
          pnpm run release 2>&1 | tee "$RUNNER_TEMP/publish.log"

      # `changeset publish` tags each package it actually published
      # (`karasu@0.7.0`, `@karasu-tools/core@0.3.0`) on the runner and nothing
      # pushes them. Hand that list to the `record` job instead of pushing from
      # here, so this job — the one holding npm publish rights — keeps a
      # read-only token (#2939).
      # Runs even when `pnpm run release` failed part-way: a package that did
      # publish before another one failed is skipped by `changeset publish` on
      # a re-run and would never be tagged otherwise.
      - name: Collect the tags of what was published
        id: published
        if: ${{ !cancelled() }}
        run: |
          tags=$( (git tag --points-at HEAD | grep '@' || true) | tr '\n' ' ' | sed 's/ *$//')
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "::notice::Published tags: ${tags:-none}"
          # A package published without its tag would drop out of the release
          # record while the run stays green (#2982). Check every tag the commit
          # must carry: what this run published, plus the current version of
          # each released npm package that is already on npm, so a re-run still
          # catches a package an earlier attempt published untagged. Fail after
          # the output is written so `record` still records the tags that exist.
          # The list is captured first: a failing command substitution in a
          # `for ... in` word list would not stop the step under `set -e`.
          # A tag for a package this run published must also point at this
          # commit: `record` only records the tags on it. Tags for versions
          # released earlier may point at their own release commit.
          expected=$(node scripts/release/published-packages.mts --log "$RUNNER_TEMP/publish.log") || {
            echo "::error::Could not work out which package tags this release needs (#2982)."
            exit 1
          }
          this_run=$(node scripts/release/published-packages.mts --log "$RUNNER_TEMP/publish.log" --this-run) || {
            echo "::error::Could not read what this run published (#2982)."
            exit 1
          }
          missing=""
          for pkg in $expected; do
            git rev-parse -q --verify "refs/tags/${pkg}" >/dev/null || missing="${missing} ${pkg}"
          done
          elsewhere=""
          for pkg in $this_run; do
            target=$(git rev-parse -q --verify "refs/tags/${pkg}^{commit}" || true)
            if [ -n "$target" ] && [ "$target" != "$GITHUB_SHA" ]; then
              elsewhere="${elsewhere} ${pkg}"
            fi
          done
          if [ -n "$missing" ] || [ -n "$elsewhere" ]; then
            [ -n "$missing" ] && echo "::error::On npm without a tag:${missing}. Tag them on the commit that released them (${GITHUB_SHA} for this release), push the tags, then re-run this workflow (#2982)."
            [ -n "$elsewhere" ] && echo "::error::Published by this run but tagged on another commit:${elsewhere}. Move the tags to ${GITHUB_SHA}, push them, then re-run this workflow (#2982)."
            exit 1
          fi

  # Records the release in the repo: pushes the package tags and creates the
  # GitHub Release `release-YYYY-MM-DD` for this commit (#2939). The VS Code
  # extension's tag is added by vscode-release.yml only after the Marketplace
  # publish succeeds, and it re-runs the same script to extend this Release.
  record:
    name: Record release
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.tags != '' }}
    # Shared with the other workflow's `record` job so the two never pick the
    # same release-YYYY-MM-DD at once: the later one starts after the earlier
    # one pushed its tags, sees the Release, and regenerates it from every tag.
    concurrency:
      group: release-record
      cancel-in-progress: false
      queue: max # keep a waiting record job instead of replacing it
    runs-on: ubuntu-latest
    permissions:
      contents: write # push tags and create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the script reads existing release-* tags

      # Node 24 runs the .mts script through type stripping; no install needed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Push package tags
        env:
          TAGS: ${{ needs.release.outputs.tags }}
        run: |
          for tag in $TAGS; do
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              if [ "$(git rev-list -n1 "refs/tags/${tag}")" != "$GITHUB_SHA" ]; then
                echo "::error::${tag} already exists on another commit."
                exit 1
              fi
              echo "${tag} already points at ${GITHUB_SHA}."
              continue
            fi
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/${tag}"
          done

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/github-release.mts --commit "$GITHUB_SHA"

  # The monthly release train (#2922): the VS Code extension ships in the same
  # run. It does not depend on npm, so it runs even when the npm publish failed
  # part-way; a job after a failed `needs` is otherwise skipped. The called
  # workflow publishes only a version the Marketplace does not have yet, and
  # its own `record` job adds the extension to this commit's Release.
  vscode:
    name: VS Code extension
    needs: release
    if: ${{ !cancelled() }}
    permissions:
      contents: write # the called `record` job pushes the tag and edits the Release
      id-token: write # azure/login exchanges the GitHub OIDC token
    uses: ./.github/workflows/vscode-release.yml
    with:
      pre_release: false

  # Closes the train's tracking Issue once everything shipped, or reports the
  # failed run on it and leaves it open, which keeps the next train from
  # departing (#2922). Only the Issue of the release branch this commit was
  # merged from is touched, so a manual run after main moved on, or a push that
  # merely edits a CHANGELOG, closes nothing.
  close-train:
    name: Close the release train Issue
    needs: [release, record, vscode]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write # comment on and close the tracking Issue
      pull-requests: read # find the PR this commit was merged from
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # find the release-* tag on this commit

      # Node 24 runs the .mts script through type stripping; no install needed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Close or report on the tracking Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RESULT: ${{ needs.release.result }}
          RECORD_RESULT: ${{ needs.record.result }}
          VSCODE_RESULT: ${{ needs.vscode.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].head.ref // empty')
          case "$branch" in
            chore/release-*) ;;
            *)
              echo "::notice::${GITHUB_SHA} was not merged from a release branch: no train to close."
              exit 0
              ;;
          esac

          issue=""
          for n in $(gh issue list --label release --state open --json number --jq '.[].number'); do
            if [ "$(gh issue view "$n" --json body --jq .body | node scripts/release/train.mts issue-branch)" = "$branch" ]; then
              issue=$n
            fi
          done
          if [ -z "$issue" ]; then
            echo "::notice::No open tracking Issue names ${branch}."
            exit 0
          fi

          if [ "$RELEASE_RESULT" = "success" ] && [ "$VSCODE_RESULT" = "success" ] &&
             { [ "$RECORD_RESULT" = "success" ] || [ "$RECORD_RESULT" = "skipped" ]; }; then
            git fetch --quiet --tags
            tag=$(git tag --points-at "$GITHUB_SHA" | grep '^release-' | head -n1 || true)
            if [ -n "$tag" ]; then
              note="Released: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}"
            else
              note="Nothing was published by ${RUN_URL} (every version was already released)."
            fi
            gh issue close "$issue" --comment "$note"
          else
            gh issue comment "$issue" --body "The release run did not finish: ${RUN_URL} (npm publish: ${RELEASE_RESULT}, npm record: ${RECORD_RESULT}, VS Code: ${VSCODE_RESULT}). Fix it and re-run the failed jobs; this Issue stays open and the next train waits for it."
            exit 1
          fi
