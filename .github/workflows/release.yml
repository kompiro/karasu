name: Release

# Publish stage of the release pipeline (OIDC trusted publishing).
#
# Fires when a release PR lands: `changeset version` only ever rewrites
# package CHANGELOG.md files, so the `paths` filter makes this run on the
# release merge — not on every push to `main` (which would waste a full
# build to no-op). `workflow_dispatch` is kept as a manual re-run fallback.
# Prepare a release with the "Release — Prepare" workflow
# (release-prepare.yml), which runs `changeset version` and pushes a
# `chore/release-*` branch for review. See ADR-1370.
#
# `changeset publish` publishes any public package whose `package.json`
# version is not yet on npm, so this is a no-op between releases. The `record`
# job then pushes the tags of what was published and creates the release's
# GitHub Release `release-YYYY-MM-DD` (#2939).
#
# Authentication is **npm Trusted Publishing via GitHub OIDC** — no
# `NPM_TOKEN`. npm exchanges the workflow's OIDC token (`id-token: write`)
# for a short-lived publish credential, provided a Trusted Publisher is
# configured for each package on npmjs.com (org `kompiro`, repo `karasu`,
# workflow file `release.yml`). Requires npm >= 11.5.1 and Node >= 22.14.0,
# which the pinned Node 24 satisfies on its own (see the publish step).
# Provenance is generated automatically
# under trusted publishing — no `--provenance` flag / `NPM_CONFIG_PROVENANCE`
# needed. See ADR-9020 (OIDC migration; follows up the token-based
# auth of ADR-1315) and docs/process.md "リリース運用".
#
# Public packages: `karasu` (CLI) and `@karasu-tools/core`. `@karasu-tools/*`
# others, `@karasu-tools/i18n` (private), and `karasu-vscode` are not
# published here (the VS Code extension ships via its own workflow — #1316).

on:
  push:
    branches: [main]
    paths:
      - "packages/**/CHANGELOG.md" # release PRs (changeset version) touch these
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.published.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24" # resolves to the latest 24.x, which bundles npm >= 11.5.1 (OIDC)
          cache: "pnpm"

      # This job deliberately carries no step that globally upgrades the npm CLI
      # before publishing (it used to). The publish chain is
      # `changeset publish` → `pnpm publish` (changesets picks the package
      # manager it detects) → the `npm` CLI on PATH, because pnpm 10 still
      # delegates publish to npm. Trusted Publishing needs npm >= 11.5.1, and
      # Node 22 bundles npm 10.x — hence the old step. Node 24 bundles npm
      # 11.17+, so the runtime satisfies the floor by itself, and pulling an
      # unpinned npm from the registry at publish time would only re-add a
      # supply-chain surface to the one job that holds publish rights.
      #
      # pnpm 11 makes `pnpm publish` native (no npm delegation), at which point
      # pnpm's own version governs this floor instead — see Issue #2401.
      # Issue #2397 / ADR-2397.

      # All dependencies (incl. `@kompiro/*`) install from the public npm
      # registry — no token needed. Publishing uses OIDC (see header).
      - run: pnpm install --frozen-lockfile

      # `pnpm run release` runs `pnpm build && changeset publish`. With a
      # Trusted Publisher configured and `id-token: write` set, npm publishes
      # tokenless via OIDC and attaches provenance automatically. Publishes
      # only versions not already on npm, so this is a no-op between releases.
      - name: Publish to npm
        run: pnpm run release

      # `changeset publish` tags each package it actually published
      # (`karasu@0.7.0`, `@karasu-tools/core@0.3.0`) on the runner and nothing
      # pushes them. Hand that list to the `record` job instead of pushing from
      # here, so this job — the one holding npm publish rights — keeps a
      # read-only token (#2939).
      # Runs even when `pnpm run release` failed part-way: a package that did
      # publish before another one failed is skipped by `changeset publish` on
      # a re-run and would never be tagged otherwise.
      - name: Collect the tags of what was published
        id: published
        if: ${{ !cancelled() }}
        run: |
          tags=$( (git tag --points-at HEAD | grep '@' || true) | tr '\n' ' ' | sed 's/ *$//')
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "::notice::Published tags: ${tags:-none}"

  # Records the release in the repo: pushes the package tags and creates the
  # GitHub Release `release-YYYY-MM-DD` for this commit (#2939). The VS Code
  # extension's tag is added by vscode-release.yml only after the Marketplace
  # publish succeeds, and it re-runs the same script to extend this Release.
  record:
    name: Record release
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.tags != '' }}
    # Shared with the other workflow's `record` job so the two never pick the
    # same release-YYYY-MM-DD at once: the later one starts after the earlier
    # one pushed its tags, sees the Release, and regenerates it from every tag.
    concurrency:
      group: release-record
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write # push tags and create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the script reads existing release-* tags

      # Node 24 runs the .mts script through type stripping; no install needed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Push package tags
        env:
          TAGS: ${{ needs.release.outputs.tags }}
        run: |
          for tag in $TAGS; do
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              if [ "$(git rev-list -n1 "refs/tags/${tag}")" != "$GITHUB_SHA" ]; then
                echo "::error::${tag} already exists on another commit."
                exit 1
              fi
              echo "${tag} already points at ${GITHUB_SHA}."
              continue
            fi
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/${tag}"
          done

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/github-release.mts --commit "$GITHUB_SHA"
