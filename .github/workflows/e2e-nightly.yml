name: E2E (nightly)

# Runs the full Playwright suite against main once a day.
# - 21:00 UTC = 06:00 JST.
# - On failure: open or update an Issue labelled `ci: nightly-e2e`.
# - On success after a previous failure: close that Issue.
# The PR-label-gated run lives in `e2e.yml` and is unaffected.

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    name: Playwright (main)
    # Ubicloud runner (ADR-1890) — same suite / same runner as the PR-side
    # `e2e.yml` run, so a nightly failure is comparable to the PR result.
    runs-on: ubicloud-standard-4-ubuntu-2404
    # Setup plus the suite, mirroring `e2e.yml` (ADR-2807). The install path is
    # the same one that has been observed at 1013s on this runner class, so the
    # budget is the same even though the nightly has not drawn a slow mirror yet.
    timeout-minutes: 35
    outputs:
      result: ${{ steps.run-tests.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @karasu-tools/e2e exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @karasu-tools/e2e exec playwright install-deps chromium

      - name: Run E2E tests
        id: run-tests
        # The bound that means "the suite hung" (ADR-2807). `notify` below reads
        # this step outcome, so a job cancelled during setup is not reported as
        # a test failure.
        timeout-minutes: 15
        run: pnpm --filter @karasu-tools/e2e test

      # Informative-only — surfaces tests that failed once then passed on
      # retry so the flake count is visible per nightly run (TPL-976
      # / #1271).
      - name: Surface flaky retry-passes
        if: always()
        run: pnpm exec tsx scripts/ci/playwright-flaky-summary.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: packages/e2e/playwright-report
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: packages/e2e/test-results
          retention-days: 14

  notify:
    name: Update tracking issue
    needs: e2e
    if: ${{ always() }}
    # GitHub-hosted on purpose (ADR-1890): a single Issues API call, no build.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open / update / close tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # The job result answers "did the job finish"; the step outcome
          # answers "did the suite reach a verdict". A job cancelled by its own
          # budget during setup has result `cancelled` and no step outcome, and
          # must not be reported as a failing suite (ADR-2807).
          OUTCOME: ${{ needs.e2e.result }}
          TEST_OUTCOME: ${{ needs.e2e.outputs.result }}
        with:
          script: |
            const label = "ci: nightly-e2e";
            const outcome = process.env.OUTCOME;
            const testOutcome = process.env.TEST_OUTCOME;

            // The suite reaches a verdict, or it does not. A job cancelled by
            // its own budget during setup reaches none, and reporting that as a
            // failing test is what #2807 removes — but a job that *failed*
            // before the suite ran (install broke, browsers would not download)
            // still leaves main unverified and has to be reported (#2807).
            const verdict =
              testOutcome === "success" || testOutcome === "failure" ? testOutcome : null;

            if (verdict === null && outcome !== "failure") {
              core.notice(
                `Nightly E2E reached no suite verdict (job: ${outcome}, tests: ${testOutcome || "never ran"}). ` +
                  "Tracking issue left untouched.",
              );
              return;
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha;
            const shortSha = sha.slice(0, 7);

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
              per_page: 10,
            });

            // Green suite closes the tracker even if a later `if: always()` step
            // (flake summary, artifact upload) failed: the tracker is about the
            // suite, and its own run stays red in Actions either way.
            if (verdict === "success") {
              for (const issue of openIssues) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Nightly E2E recovered on \`${shortSha}\`. Closing.\n\nRun: ${runUrl}`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed",
                  state_reason: "completed",
                });
              }
              return;
            }

            // Failure path — open or update the rolling tracker. A job that
            // failed before the suite ran says so, rather than claiming a test
            // failed.
            const headline =
              verdict === "failure"
                ? `Nightly E2E failed on \`${shortSha}\`.`
                : `Nightly E2E could not run on \`${shortSha}\` — the job failed before the suite reported (job: ${outcome}).`;
            const body = [
              headline,
              ``,
              `- Run: ${runUrl}`,
              `- Commit: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${sha}`,
              ``,
              `Artefacts (\`playwright-report\`, \`playwright-test-results\`) are attached to the run for 14 days.`,
            ].join("\n");

            if (openIssues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "Nightly E2E failing on main",
                body,
                labels: [label],
              });
            } else {
              // Comment on the oldest open tracker; ignore any duplicates.
              const target = openIssues[openIssues.length - 1];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: target.number,
                body,
              });
            }
