name: ADR validate

# Companion of `adr-validate-skip.yml`. This workflow runs the real ADR
# validator on PRs that touch ADR paths. The skip workflow emits a no-op
# `Validate` job for all other PRs so the Required status named
# `Validate` stays green repository-wide.
#
# Keep the `paths:` list below in sync with `adr-validate-skip.yml`'s
# `paths-ignore:`. If you add a new ADR-related path here, mirror it
# under `paths-ignore:` in the skip workflow.

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/adr/**"
      - "adr.config.json"
      - "tpl.config.json"
      - "scripts/lint/config-topics-sync.ts"
      - ".github/workflows/adr-validate.yml"
  push:
    branches: [main]
    paths:
      - "docs/adr/**"
      - "adr.config.json"
      - "tpl.config.json"
      - "scripts/lint/config-topics-sync.ts"
      - ".github/workflows/adr-validate.yml"

concurrency:
  group: adr-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read # read the repo's labels for the topic: label check

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The topic label step diffs HEAD against its first parent: the base
          # branch for a PR's merge commit, the previous main for a push.
          fetch-depth: 2

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Validate ADR frontmatter
        run: pnpm run adr:validate

      - name: Run validator tests
        run: pnpm run test:scripts

      - name: Check generated ADR files (effective.md, graph.md, graph/*.md)
        run: pnpm exec adr regenerate --check

      - name: Check ADR assumptions against the working tree
        run: pnpm exec adr check-assumptions --quiet

      # Only when this commit changes topics or the check itself (Issue #3314).
      # Label operations happen before the topics PR merges, so for a while the
      # labels run ahead of main's config; checking on every ADR PR would fail
      # the unrelated ones in that window. The push run after the merge
      # confirms the labels caught up.
      - name: Check topic labels against adr.config.json topics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qxE '(adr|tpl)\.config\.json|scripts/lint/config-topics-sync\.ts|\.github/workflows/adr-validate\.yml'; then
            pnpm run lint:config-topics-sync:labels
          else
            echo "This commit changes neither topics nor the check; the topic label check is skipped."
          fi
