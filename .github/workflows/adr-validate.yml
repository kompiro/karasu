name: ADR validate

# Companion of `adr-validate-skip.yml`. This workflow runs the real ADR
# validator on PRs that touch ADR paths, the topics configs, the topic label
# checker, the generated-index check or the dependencies (a generator upgrade
# must still run, Issue #3416). The skip workflow emits a no-op
# `Validate` job for all other PRs so the Required status named
# `Validate` stays green repository-wide.
#
# Keep the `paths:` list below in sync with `adr-validate-skip.yml`'s
# `paths-ignore:`. If you add a new ADR-related path here, mirror it
# under `paths-ignore:` in the skip workflow.

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/adr/**"
      - "adr.config.json"
      - "tpl.config.json"
      - "scripts/lint/config-topics-sync.ts"
      - "scripts/adr/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/adr-validate.yml"
  push:
    branches: [main]
    paths:
      - "docs/adr/**"
      - "adr.config.json"
      - "tpl.config.json"
      - "scripts/lint/config-topics-sync.ts"
      - "scripts/adr/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/adr-validate.yml"

concurrency:
  # A PR's runs share a group and cancel each other. Each main push gets its
  # own group: a later push must not cancel or replace (while pending) the run
  # whose HEAD^1 diff holds a topics change, or that change's label check is
  # lost.
  group: adr-validate-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: read # read the repo's labels for the topic: label check

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The topic label step diffs HEAD against its first parent: the base
          # branch for a PR's merge commit, the previous main for a push (main
          # takes squash merges only, so one push is one PR). The generated-index
          # check needs the merge base of the PR's base and head, so the whole
          # history is fetched.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Validate ADR frontmatter
        run: pnpm run adr:validate

      - name: Run validator tests
        run: pnpm run test:scripts

      # PRs no longer carry the generated index; the daily regeneration PR does
      # (Issue #3416). A PR either leaves the generated files alone or changes
      # only them, as an exact regeneration of its head; the generator must run
      # either way. The inputs come from the PR head, not the merge ref: ADRs
      # merged to main after the PR was made must not fail it. The generator is
      # the merge ref's, so an upgrade already on main judges the PR; a
      # regeneration PR made before that upgrade fails until the next run
      # regenerates it. On a push to main the base
      # is the pushed commit itself, so only the generator runs: main's index
      # lags until the next regeneration PR.
      - name: Check the generated ADR index (effective.md, graph.md, graph/*.md)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: pnpm exec tsx scripts/adr/check-generated.ts --base "$BASE" --head "$HEAD_SHA"

      - name: Check ADR assumptions against the working tree
        run: pnpm exec adr check-assumptions --quiet

      # Only when this commit changes topics or the checker (Issue #3314).
      # Label operations happen before the topics PR merges, so for a while the
      # labels run ahead of main's config; checking on every ADR PR (or on a
      # Dependabot bump of this workflow) would fail the unrelated ones in that
      # window. The push run after the merge confirms main caught up with the
      # labels. The diff is captured first so that a failing git diff fails the
      # step instead of reading as "no topics change".
      - name: Check topic labels against adr.config.json topics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          if grep -qxE '(adr|tpl)\.config\.json|scripts/lint/config-topics-sync\.ts' <<<"$changed"; then
            pnpm run lint:config-topics-sync:labels
          else
            echo "This commit changes neither topics nor the checker; the topic label check is skipped."
          fi
