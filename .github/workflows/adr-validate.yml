name: ADR validate

# Companion of `adr-validate-skip.yml`. This workflow runs the real ADR
# validator on PRs that touch ADR paths, the topics configs or the topic label
# checker. The skip workflow emits a no-op
# `Validate` job for all other PRs so the Required status named
# `Validate` stays green repository-wide.
#
# Keep the `paths:` list below in sync with `adr-validate-skip.yml`'s
# `paths-ignore:`. If you add a new ADR-related path here, mirror it
# under `paths-ignore:` in the skip workflow.

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/adr/**"
      - "adr.config.json"
      - "tpl.config.json"
      - "scripts/lint/config-topics-sync.ts"
      - ".github/workflows/adr-validate.yml"
  push:
    branches: [main]
    paths:
      - "docs/adr/**"
      - "adr.config.json"
      - "tpl.config.json"
      - "scripts/lint/config-topics-sync.ts"
      - ".github/workflows/adr-validate.yml"

concurrency:
  # A PR's runs share a group and cancel each other. Each main push gets its
  # own group: a later push must not cancel or replace (while pending) the run
  # whose HEAD^1 diff holds a topics change, or that change's label check is
  # lost.
  group: adr-validate-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: read # read the repo's labels for the topic: label check

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The topic label step diffs HEAD against its first parent: the base
          # branch for a PR's merge commit, the previous main for a push (main
          # takes squash merges only, so one push is one PR).
          fetch-depth: 2

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Validate ADR frontmatter
        run: pnpm run adr:validate

      - name: Run validator tests
        run: pnpm run test:scripts

      - name: Check generated ADR files (effective.md, graph.md, graph/*.md)
        run: pnpm exec adr regenerate --check

      - name: Check ADR assumptions against the working tree
        run: pnpm exec adr check-assumptions --quiet

      # Only when this commit changes topics or the checker (Issue #3314).
      # Label operations happen before the topics PR merges, so for a while the
      # labels run ahead of main's config; checking on every ADR PR (or on a
      # Dependabot bump of this workflow) would fail the unrelated ones in that
      # window. The push run after the merge confirms main caught up with the
      # labels. The diff is captured first so that a failing git diff fails the
      # step instead of reading as "no topics change".
      - name: Check topic labels against adr.config.json topics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          if grep -qxE '(adr|tpl)\.config\.json|scripts/lint/config-topics-sync\.ts' <<<"$changed"; then
            pnpm run lint:config-topics-sync:labels
          else
            echo "This commit changes neither topics nor the checker; the topic label check is skipped."
          fi
