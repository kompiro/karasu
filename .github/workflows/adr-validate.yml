name: ADR validate

# Companion of `adr-validate-skip.yml`. This workflow runs the real ADR
# validator on PRs that touch ADR paths. The skip workflow emits a no-op
# `Validate` job for all other PRs so the Required status named
# `Validate` stays green repository-wide.
#
# Keep the `paths:` list below in sync with `adr-validate-skip.yml`'s
# `paths-ignore:`. If you add a new ADR-related path here, mirror it
# under `paths-ignore:` in the skip workflow.
#
# The `label` trigger is the other side of the topic: label check (Issue
# #3314, TPL-1480): labels change on GitHub, not in a PR, so creating,
# renaming or deleting a label runs the same check against main.

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/adr/**"
      - "adr.config.json"
      - "tpl.config.json"
      - "scripts/lint/config-topics-sync.ts"
      - ".github/workflows/adr-validate.yml"
  push:
    branches: [main]
    paths:
      - "docs/adr/**"
      - "adr.config.json"
      - "tpl.config.json"
      - "scripts/lint/config-topics-sync.ts"
      - ".github/workflows/adr-validate.yml"
  label:
    types: [created, edited, deleted]

concurrency:
  # A label event runs on main's ref; keep it from cancelling a push run there.
  group: adr-validate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read # read the repo's labels for the topic: label check

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Validate ADR frontmatter
        run: pnpm run adr:validate

      - name: Run validator tests
        run: pnpm run test:scripts

      - name: Check generated ADR files (effective.md, graph.md, graph/*.md)
        run: pnpm exec adr regenerate --check

      - name: Check ADR assumptions against the working tree
        run: pnpm exec adr check-assumptions --quiet

      - name: Check topic labels against adr.config.json topics
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm run lint:config-topics-sync:labels
