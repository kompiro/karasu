name: TPL deprecation review

# Opens a periodic TPL deprecation review Issue on the 1st of every month
# at 09:00 UTC.
#
# Cadence was weekly during rollout to catch obsolescence in the freshly
# backfilled batch. It stabilized exactly as hoped — no TPL has ever been
# deprecated and the 2026-W30 / W31 reviews came back all `keep` — so the
# weekly Issue was pure queue noise and the cadence stretched to monthly
# (#2094 / #2136). Stretch further to semi-annual if monthly reviews stay
# all-`keep` too; tighten back if a review ever deprecates several at once.
#
# `workflow_dispatch` is the manual escape hatch — used for the bootstrap
# review and for ad-hoc runs (e.g. right after a major architectural change).

on:
  schedule:
    # 09:00 UTC on the 1st of every month.
    - cron: "0 9 1 * *"
  workflow_dispatch:

concurrency:
  group: tpl-review-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  open-review-issue:
    name: Open TPL review Issue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Generate review Issue body
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: pnpm --silent tpl:review:body > /tmp/tpl-review-body.md

      - name: Compute period label
        id: period
        run: |
          # Calendar month, e.g. 2026-08 — one review Issue per month.
          label=$(date -u +%Y-%m)
          echo "label=${label}" >> "$GITHUB_OUTPUT"

      - name: Open review Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "TPL deprecation review — ${{ steps.period.outputs.label }}" \
            --label "documentation" \
            --body-file /tmp/tpl-review-body.md
