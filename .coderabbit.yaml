# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
#
# CodeRabbit — automated first-pass review on every PR.
#
# Why it exists and what stays out of its reach: docs/adr/2640-coderabbit-pr-review.md.
# It is advisory only: it never approves, never blocks, and is not a required check.
# The mechanical layer (lint / format / typecheck / knip / check:cycles / the drift
# guards in lefthook.yml and ci.yml) is already covered by CI, so the instructions
# below aim at what a linter cannot see.

language: en-US

reviews:
  profile: chill

  # The maintainer keeps the merge decision. Do not turn this on without
  # revisiting ADR-2640.
  request_changes_workflow: false

  high_level_summary: true
  poem: false

  auto_review:
    enabled: true
    # Drafts are work in progress, and `spike/**` branches routinely open as one.
    drafts: false
    # Dependency PRs are triaged by the /hane:dependabot workflow against the
    # supply-chain criteria in docs/release.md; a second opinion on a lockfile
    # bump is noise. `[bot]` is the author's GitHub login form.
    ignore_usernames:
      - dependabot[bot]
      - renovate[bot]

  path_filters:
    # Regenerated by `pnpm adr:regenerate`; reviewing them reviews the generator.
    - "!docs/adr/effective.md"
    - "!docs/adr/graph.md"
    - "!docs/adr/graph/**"
    # Regenerated by `pnpm gen:guide-diagrams` from the marked krs blocks.
    - "!docs/guide/diagrams/**"
    - "!pnpm-lock.yaml"

  path_instructions:

    - path: "packages/**/*.{ts,tsx}"
      instructions: |
        - Tests are Vitest, co-located as `*.test.ts(x)`. Vitest globals are NOT
          enabled: a React Testing Library test file must register
          `afterEach(cleanup)` itself, or DOM from earlier tests leaks forward.
        - Prefer `userEvent` over `fireEvent` when driving Radix-backed
          (shadcn/ui) components — `fireEvent.click` omits pointerdown/pointerup
          and is silently dropped.
        - A user-visible change to `karasu` (CLI), `@karasu-tools/core` or
          `karasu-vscode` needs a `.changeset/*.md` in the same PR naming those
          packages. `@karasu-tools/app`, `lsp`, `e2e` and `vscode-e2e` are not
          published and never need one.

    # The i18n rules reach only the packages `docs/spec/i18n.md` governs — what
    # an end user reads in the app, the SVG output, the CLI's stdout, the LSP
    # and the VS Code extension — plus `core`, whose rule is that it must *not*
    # import the table. Globbed at `packages/**` they also landed on `nest`,
    # whose strings are JSON API error bodies, twice on #2601. Both findings
    # were withdrawn on the argument below, which is the sign the glob was
    # wider than the convention. A new package that puts strings in front of a
    # user goes in this list.
    - path: "packages/{app,cli,core,i18n,lsp,vscode,vscode-e2e}/**/*.{ts,tsx}"
      instructions: |
        - User-facing strings (diagnostics, warnings, UI labels) belong in
          @karasu-tools/i18n, not inlined at the call site. See docs/spec/i18n.md.
        - Locale normalization has one owner, `resolveLocaleTag` in
          @karasu-tools/i18n. Flag any re-inlined `startsWith("ja")`-style test.

    - path: "packages/core/src/**/*.ts"
      instructions: |
        Production code under `packages/core/src` imports deep paths
        (`./parser/parser.js`), never an internal barrel (`**/index.js`) — a
        barrel from the inside creates a runtime cycle. Only test files may
        import `../index.js`, as a public-API smoke test. Flag any new
        production import of an internal `index.js`.

    - path: "packages/nest/**/*.ts"
      instructions: |
        - `packages/nest` is the Cloudflare Workers deployment that holds the
          service secrets, and it carries no runtime dependency but
          `@karasu-tools/core`. Flag a new entry under `dependencies`; never
          propose one. Its user-visible surface is a JSON API whose `error.code`
          is what callers branch on, so its messages are outside the
          `docs/spec/i18n.md` scope — do not ask for them to move into
          `@karasu-tools/i18n`.
        - Every KV key prefix this package writes has to be sweepable and has to
          be stated. A new prefix needs a seeder entry in the purge-coverage
          ledger (`gallery-purge-coverage.test.ts` — TPL-2226) and a retention
          row in `docs/policy/nest-data-handling.md`, which
          `scripts/lint/nest-retention-policy-sync.test.ts` then holds against
          the constants. Those guards cannot see a prefix nobody added to them,
          which is the one part of this a reviewer has to carry. The document is
          a claim about what the service does with what a submitter entrusted to
          it, so a prefix missing from it is a broken promise rather than a
          stale doc.

    - path: ".github/workflows/**"
      instructions: |
        - A path-filtered required check needs a paired skip stub: a companion
          `*-skip.yml` declaring the same job `name:`, whose filter is the exact
          complement of the main workflow's (ADR-953). Which key carries the
          filter differs by pair — `ci.yml` filters with `paths-ignore:` against
          `ci-skip.yml`'s `paths:`, while `e2e.yml`, `adr-validate.yml` and
          `reference-docs-check.yml` filter with `paths:` against their stub's
          `paths-ignore:` — so compare the two path sets, never the key names.
          Flag a changed filter whose companion was not updated in the same PR,
          and any pair whose sets stopped being complements: without a firing
          stub the required check hangs pending forever and the PR cannot merge.
        - Jobs that need repository secrets must skip on bot-authored PRs;
          secrets are not passed to them and the job fails unconditionally
          (ADR-903).

    - path: "docs/adr/**/*.md"
      instructions: |
        ADRs are written in Japanese (frontmatter `title` and body); identifiers
        and product names stay in English. `pnpm adr:validate` owns the
        frontmatter schema, the literal `ADR-<n>` id form and the `supersedes` /
        `superseded_by` pairing — do not restate those, and never propose
        changing them (a bare numeric `id` was proposed once; it would fail the
        Validate check, on this record and on all 353 others). Report instead:
        - an `<n>` that is not the originating GitHub Issue number — or the PR
          number when no Issue started it. A date or a running sequence is
          wrong, and the validator cannot tell which number was chosen.
        - a new ADR that overturns what an accepted ADR still states, without
          declaring `supersedes` for it. The validator only checks the pairs
          that are already declared.
        - a renumbering of an existing ADR.

        The body and the `assumptions:` frontmatter have opposite rules, so
        judge them separately.

        The body records a decision at its date. It is not rewritten when the
        code moves on: a later ADR supersedes it, and the old one stays as it
        was (ADR-706 states this for a rename). Flag a changed sentence in the
        body of an existing ADR.

        `assumptions:` is a drift guard, not prose. `pnpm adr:check-assumptions`
        resolves every `file:` / `symbol:` / `grep:` entry against the working
        tree, so a PR that deletes or renames what an entry names has to update
        that entry in the same PR or the check fails. Replacing an entry with a
        sentence recording what the code used to be is the established way to
        keep a superseded ADR honest (ADR-2578 and ADR-1994 both read that way).
        Never ask for an `assumptions:` edit to be reverted, and never report
        one as a rewrite of the decision.

    - path: "docs/**/*.md"
      instructions: |
        - `docs/spec/*.md` and `docs/concepts.md` are English with a `*.ja.md`
          twin; the pair must keep an identical heading structure, so a section
          added, removed or re-leveled on one side only is a defect. Everything
          else under `docs/` (process, adr, design, prd, test-perspectives) is
          Japanese — do not propose translating it or restyling its prose.
        - Regions between `<!-- gen:reference:* -->` markers in `docs/spec/*.md`
          are generated from `packages/core/src/builtins/reference-data.ts` by
          `pnpm gen:reference`. A hand edit inside one is always wrong.
        - Review documents for factual drift instead: stale command names, dead
          relative links, and claims contradicted by the code in the same PR.

    - path: "docs/design/**/*.md"
      instructions: |
        Design docs are Japanese drafts and transient by design: once the
        decision lands, the content is promoted into `docs/adr/` and the file is
        deleted. Do not comment on the wording, structure or completeness of the
        document itself. Report only:
        - a statement that contradicts an ADR still in force (`docs/adr/*.md`
          with `status: accepted`) or `docs/spec/`
        - an assumption the design depends on but never states
        - an alternative dismissed without a reason

    - path: "docs/acceptance/**/*.md"
      instructions: |
        Unchecked manual items (`- [ ]`) are the normal steady state — they are
        re-run every release rather than closed out once. Never suggest checking
        them off. Do flag acceptance criteria that no longer match the behavior
        the PR implements.

    - path: "docs/test-perspectives/**/*.md"
      instructions: |
        TPL = Test Perspective Library: one file, one recurring failure mode,
        written in Japanese. `pnpm tpl:validate` owns the frontmatter schema,
        the literal `TPL-<n>` id form and the topic vocabulary — do not restate
        those, and never propose changing them. Report instead:
        - an `<n>` that is not the issue named in the first `discovered_from`
          entry. Numbering falls back to the PR number and then to local
          numbering (ADR-2188), so a mismatch is not always wrong — but the
          validator checks the shape, never which number was chosen.
        - a perspective pinned to the abstraction level of the single bug that
          produced it. `applicable_to` holds reusable abstract patterns;
          concrete features belong in `known_consumers`. A perspective that can
          only ever match its originating feature will never fire again.
        - a checklist outside 3-5 items, or an item phrased as an intention
          ("X に気をつける") instead of an observable condition someone can
          answer yes/no to.
        - a perspective an existing TPL already covers — appending the new
          Issue to that record's `discovered_from` is the intended move, not a
          new file.
        - "関連テスト" left empty, or naming a test path that does not exist.
        - a proactive TPL derived from `docs/spec/**` or `docs/concepts*.md`
          that has no "## 派生元 spec" section, or whose source section did not
          gain a "> Related TPLs:" annotation in the same PR. The link is
          bidirectional; one side alone is a defect.

    - path: "examples/**"
      instructions: |
        `packages/core/src/examples.test.ts` owns the mirror between the
        registered directories under `examples/` and their constants in
        `packages/core/src/builtins/examples.ts`: it reads the files from disk
        and asserts byte equality, so a one-sided edit fails CI from either
        side. Do not restate that. Report instead:
        - a new directory under `examples/` that is registered in neither
          `examples.ts` nor the table in `.claude/rules/examples-sync.md`.
          Nothing compares an unregistered directory against anything.
        - a hand edit to `examples/{ja,en}/ec-platform/` or
          `examples/en/feature-samples/`, which are maintained through the
          `/update-examples` skill rather than edited directly.

  pre_merge_checks:
    title:
      mode: warning
      requirements: |
        English, Conventional Commits: `type(scope): subject`. Type is one of
        feat / fix / docs / chore / refactor / test / perf / build / ci; scope is
        the package or area (core, app, cli, lsp, vscode, nest, i18n, adr, ci).
        Imperative mood, no trailing period.
    description:
      mode: warning
    issue_assessment:
      mode: warning
    # No docstring coverage policy in this repo — the default 80% threshold
    # would report against a standard nobody agreed to.
    docstrings:
      mode: "off"

  tools:
    # Same linter the repo runs (`pnpm lint`), so findings line up with CI.
    oxc:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    # Prose checkers tuned for English, on a tree that is mostly Japanese docs.
    markdownlint:
      enabled: false
    languagetool:
      enabled: false

knowledge_base:
  code_guidelines:
    enabled: true
    # `.claude/rules/*.md` is the source of truth for editing conventions; the
    # default pattern set does not reach it. Listing CLAUDE.md explicitly keeps
    # it in scope now that the defaults are replaced.
    filePatterns:
      - "CLAUDE.md"
      - "CONTRIBUTING.md"
      - "docs/process.md"
      - ".claude/rules/*.md"
