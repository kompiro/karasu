<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>karasu viewer (spike #2993)</title>
    <script>
      // Spike #2993: an opaque-origin document throws on any Storage access.
      // Replace both with in-memory stand-ins before the app reads them, so
      // preferences fall back to defaults instead of crashing the viewer.
      (function () {
        function memoryStorage() {
          var data = new Map();
          return {
            get length() { return data.size; },
            key: function (i) { return Array.from(data.keys())[i] ?? null; },
            getItem: function (k) { return data.has(k) ? data.get(k) : null; },
            setItem: function (k, v) { data.set(String(k), String(v)); },
            removeItem: function (k) { data.delete(k); },
            clear: function () { data.clear(); },
          };
        }
        ["localStorage", "sessionStorage"].forEach(function (name) {
          try { window[name].length; } catch (e) {
            Object.defineProperty(window, name, { value: memoryStorage(), configurable: true });
          }
        });
      })();
    </script>
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--KRS_SOURCE-->
    <script type="module" src="/src/viewer-main.tsx"></script>
  </body>
</html>
