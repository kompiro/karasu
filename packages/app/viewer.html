<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>karasu</title>
    <!--
      The gallery viewer (#2997). Served under a page-level CSP sandbox without
      allow-same-origin, so the document has an opaque origin. The server
      fills two placeholders in <body>, each exactly once: GALLERY_HEADER with
      its own static markup above the app (or nothing), and KRS_SOURCE with
      the submission as JSON (src/viewer/embedded-source.ts). nest's
      src/gallery/viewer-page.ts is that server; keep the two in step.
    -->
    <style>
      /* The app fills the viewport; a host's header, if any, takes its own
         height above it and the app gets the rest. */
      body {
        display: flex;
        flex-direction: column;
      }
      #root {
        flex: 1 1 auto;
        min-height: 0;
        height: auto;
      }
    </style>
    <script data-storage-shim>
      // An opaque-origin document throws on any Storage access. Replace both
      // with in-memory stand-ins before the bundle reads them, so preferences
      // fall back to defaults (and last for this page view) instead of
      // crashing the viewer at startup. Tested by src/viewer/viewer-html.test.ts.
      (function () {
        function memoryStorage() {
          var data = new Map();
          return {
            get length() {
              return data.size;
            },
            key: function (i) {
              return Array.from(data.keys())[i] ?? null;
            },
            getItem: function (k) {
              k = String(k);
              return data.has(k) ? data.get(k) : null;
            },
            setItem: function (k, v) {
              data.set(String(k), String(v));
            },
            removeItem: function (k) {
              data.delete(String(k));
            },
            clear: function () {
              data.clear();
            },
          };
        }
        ["localStorage", "sessionStorage"].forEach(function (name) {
          try {
            window[name].length;
          } catch (e) {
            Object.defineProperty(window, name, { value: memoryStorage(), configurable: true });
          }
        });
      })();
    </script>
    <script>
      // Pre-paint theme, so a dark-scheme reader does not see a light flash.
      (function () {
        try {
          document.documentElement.dataset.theme =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <!--GALLERY_HEADER-->
    <div id="root"></div>
    <!--KRS_SOURCE-->
    <script type="module" src="/src/viewer/main.tsx"></script>
  </body>
</html>
