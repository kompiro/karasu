# karasu-nest: a Worker deployed independently of the Pages app.
#
# ADR-1990 decision 5. The root `wrangler.toml` describes the Pages project
# (`pages_build_output_dir = "packages/app/dist"`) and must stay untouched by
# this service: sharing a deploy would put this Worker's secrets and KV
# namespace in the same blast radius as the static app, and would make the two
# impossible to roll back separately.
#
# Deployed by `.github/workflows/nest-deploy.yml`, which runs wrangler from
# this directory so the root config is not picked up.

name = "karasu-nest"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

# This service needs a paid Workers plan, and the reason is CPU rather than
# anything about scale.
#
# The free plan allows 10ms of CPU per invocation. Decompressing a repository
# archive, walking its tar headers, running the redaction rules over ~400KB of
# source and parsing three model replies are all well past that -- a real run
# died in 3 seconds of wall time with `Worker exceeded CPU time limit`, which
# is only possible if the ceiling is far below a second.
#
# Declared rather than left to be discovered: an unset limit means the default,
# and the default is the thing that killed a run. 60 seconds is generous
# against the few seconds of parsing this actually does, and still bounded, so
# a runaway is stopped rather than billed. Model calls are I/O and cost no CPU.
[limits]
cpu_ms = 60_000

[vars]
ENVIRONMENT = "production"

# The generated-`.krs` cache and the `owner/repo` directory share one
# namespace; they are separated by key prefix (`krs/v1/` and `idx/v1/`) rather
# than by binding, because a purge has to see both.
#
# `id` is filled in per account by `wrangler kv namespace create KRS_CACHE`.
# It is a namespace identifier, not a credential.
[[kv_namespaces]]
binding = "KRS_CACHE"
id = "6c08ed60d4754649bf396e1063e331a3"

# Secrets are NOT declared here. `wrangler secret put` sets them on the
# deployed Worker, so they never enter the repository:
#
#   wrangler secret put GITHUB_APP_ID           # 1992
#   wrangler secret put GITHUB_APP_PRIVATE_KEY  # 1992
#   wrangler secret put GITHUB_WEBHOOK_SECRET   # 2286
#
# `GET /healthz` reports which of these the running deploy actually has, as
# booleans, so a deploy missing one is diagnosable without reading them back.
